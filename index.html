<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Cho vay ngang hàng 2026</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap">
<style>
:root { --bg: #F4F7F7; --surface: #FFFFFF; --ink: #10222B; --muted: #546870; --line: #D8E1E3; --accent: #0D7A68; --crit: #B3362E; }
@media (prefers-color-scheme: dark) { :root { --bg: #0D1618; --surface: #14211F; --ink: #E5EEEF; --muted: #98ABB1; --line: #26383B; --accent: #3EC4A8; --crit: #EF7C72; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
  font-family: "Be Vietnam Pro", "Segoe UI", system-ui, -apple-system, sans-serif; padding: 24px 16px; }
form { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 28px; display: grid; gap: 14px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
h1 { margin: 0; font-size: 22px; font-weight: 800; line-height: 1.3; }
p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
label { font-size: 13px; font-weight: 600; }
input { width: 100%; font: inherit; font-size: 16px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
button { font: inherit; font-weight: 600; font-size: 15px; padding: 11px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
button:disabled { opacity: 0.6; cursor: progress; }
button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
#err { color: var(--crit); font-size: 13.5px; min-height: 1.2em; }
</style>
</head>
<body>
<form id="gate" autocomplete="off">
  <div class="eyebrow">Báo cáo nội bộ</div>
  <h1>Cho vay ngang hàng: thế giới và Việt Nam</h1>
  <p>Nhập mật khẩu để mở báo cáo.</p>
  <div style="display:grid;gap:6px">
    <label for="pw">Mật khẩu</label>
    <input id="pw" type="password" required autofocus>
  </div>
  <button id="go" type="submit">Mở báo cáo</button>
  <div id="err" role="alert"></div>
</form>

const u8 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function unlock(pass) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: u8(P.s), iterations: P.n, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(P.i) }, key, u8(P.c));
  return new TextDecoder().decode(pt);
}
document.getElementById('gate').addEventListener('submit', async (e) => {

  const btn = document.getElementById('go'), err = document.getElementById('err');
  btn.disabled = true; btn.textContent = 'Đang mở…'; err.textContent = '';
  try {
    const html = await unlock(document.getElementById('pw').value);
    document.open(); document.write(html); document.close();
  } catch (_) {
    err.textContent = 'Mật khẩu không đúng. Vui lòng thử lại.';
    btn.disabled = false; btn.textContent = 'Mở báo cáo';
